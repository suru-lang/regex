name: 試験

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: PCRE2 と clang を入れる(Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev clang pkg-config
      - name: PCRE2 を入れる(macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2 pkg-config
      - name: kumu を入れる
        run: go install github.com/suru-lang/suru/cmd/kumu@main
      - name: 試験
        run: ~/go/bin/kumu 試験
